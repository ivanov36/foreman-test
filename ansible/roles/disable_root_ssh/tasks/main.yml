---
- name: Disable root SSH login (main config)
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin no'
    state: present

- name: Override PermitRootLogin in sshd_config.d
  copy:
    dest: /etc/ssh/sshd_config.d/00-disable-root.conf
    content: |
      # Managed by Ansible role: disable_root_ssh
      PermitRootLogin no
    owner: root
    group: root
    mode: '0600'
  notify: Restart sshd